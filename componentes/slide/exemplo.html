<!doctype html>
<html data-theme="claro" lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><title>Slide</title></head>
<body>
<div class="ii-pad"><div style="width:768px;height:432px;overflow:hidden">
<div class="ii-peca ii-peca--claro" style="width:1920px;height:1080px;transform:scale(.4);transform-origin:0 0">
  <div class="ii-trapezio" style="left:0;top:0;width:150px;height:820px;clip-path:polygon(0 0,100% 0,0 100%)"></div>
  <img src="../../assets/logos/inova-invest-cor.png" alt="Inova+Invest" style="position:absolute;left:220px;top:90px;width:300px">
  <div style="position:absolute;left:220px;top:320px;width:1440px;display:flex;flex-direction:column;gap:32px">
    <div class="ii-row"><span class="ii-etiqueta" style="font-size:22px;line-height:28px;padding:8px 16px">Webinar · 28 de janeiro de 2026</span></div>
    <div style="font:700 96px/100px var(--font-marca);letter-spacing:-.01em;color:var(--azul);text-wrap:balance">Como preparar sua startup para captar investimento</div>
    <div style="font:500 34px/48px var(--font-marca);color:#4a5580;max-width:44ch">Um programa da ABVCAP e da ApexBrasil para startups do Nordeste com tração.</div>
  </div>
  <div class="ii-assinatura" style="--ii-h:52px;position:absolute;left:220px;right:120px;bottom:60px;padding:0;gap:56px">
    <div class="ii-assinatura__grupo"><span class="ii-assinatura__rotulo" style="font-size:20px;line-height:26px">Realização</span><div class="ii-assinatura__marcas" style="gap:40px"><img src="../../assets/logos/inova-invest-cor.png" alt="Inova+Invest" style="height:66px"><img src="../../assets/assinatura/abvcap-cor.png" alt="ABVCAP"></div></div>
    <div class="ii-assinatura__grupo"><span class="ii-assinatura__rotulo" style="font-size:20px;line-height:26px">Promovido por</span><div class="ii-assinatura__marcas"><img src="../../assets/assinatura/apex-gov-horizontal-cor.png" alt="ApexBrasil e Governo do Brasil"></div></div>
    <span class="ii-assinatura__sep"></span>
    <div class="ii-assinatura__grupo"><span class="ii-assinatura__rotulo" style="font-size:20px;line-height:26px">Parceria</span><div class="ii-assinatura__marcas"><img src="../../assets/assinatura/ace-ventures-preta.png" alt="ACE Ventures" style="height:44px"></div></div>
  </div>
</div></div></div>
</body>
</html>
