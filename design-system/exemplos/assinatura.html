<!doctype html>
<html data-theme="claro" lang="pt-BR">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../componentes.css"><meta charset="utf-8"><title>Assinatura</title></head>
<body>
<div class="ii-stack ii-pad" style="background:var(--azul-050)">
<div class="ii-assinatura" style="--ii-h:40px">
  <div class="ii-assinatura__grupo"><span class="ii-assinatura__rotulo">Realização</span>
    <div class="ii-assinatura__marcas"><img src="../logos/inova-invest-cor.png" alt="Inova+Invest" style="height:calc(var(--ii-h)*1.25)"><img src="../assinatura/abvcap-cor.png" alt="ABVCAP"></div></div>
  <div class="ii-assinatura__grupo"><span class="ii-assinatura__rotulo">Promovido por</span>
    <div class="ii-assinatura__marcas"><img src="../assinatura/apex-gov-horizontal-cor.png" alt="ApexBrasil, Ministério do Desenvolvimento, Indústria, Comércio e Serviços e Governo do Brasil"></div></div>
  <span class="ii-assinatura__sep"></span>
  <div class="ii-assinatura__grupo"><span class="ii-assinatura__rotulo">Parceria</span>
    <div class="ii-assinatura__marcas"><img src="../assinatura/ace-ventures-preta.png" alt="ACE Ventures" style="height:calc(var(--ii-h)*.8)"></div></div>
</div>
<div class="ii-assinatura" style="--ii-h:28px">
  <div class="ii-assinatura__grupo"><span class="ii-assinatura__rotulo">Realização</span>
    <div class="ii-assinatura__marcas"><img src="../logos/inova-invest-cor.png" alt="Inova+Invest" style="height:calc(var(--ii-h)*1.25)"><img src="../assinatura/abvcap-cor.png" alt="ABVCAP"></div></div>
  <div class="ii-assinatura__grupo"><span class="ii-assinatura__rotulo">Promovido por</span>
    <div class="ii-assinatura__marcas"><img src="../assinatura/apex-gov-horizontal-cor.png" alt="ApexBrasil, Ministério do Desenvolvimento, Indústria, Comércio e Serviços e Governo do Brasil"></div></div>
  <span class="ii-assinatura__sep"></span>
  <div class="ii-assinatura__grupo"><span class="ii-assinatura__rotulo">Parceria</span>
    <div class="ii-assinatura__marcas"><img src="../assinatura/ace-ventures-preta.png" alt="ACE Ventures" style="height:calc(var(--ii-h)*.8)"></div></div>
</div>
</div>
</body>
</html>
